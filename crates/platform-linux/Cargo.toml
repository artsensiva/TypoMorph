[package]
name = "platform-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
core-engine = { path = "../core-engine" }
serde = "1"
async-io = "2"
futures-lite = "2"
evdev = "0.12"
nix = "0.23"
thiserror = "1"
zbus = { version = "4", default-features = false, features = ["async-io"] }
xkbcommon = { version = "0.9.0", default-features = false }

[dev-dependencies]
tempfile = "3"
