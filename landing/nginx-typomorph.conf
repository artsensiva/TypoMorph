# Example static-site server block for software.vintage-turntables.com.
# Copy into /etc/nginx/sites-available/typomorph and enable it with a symlink.
server {
    listen 80;
    listen [::]:80;
    # TODO: replace with production domain before final launch
    server_name software.vintage-turntables.com;

    root /srv/typomorph/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:deb|dmg|msi|sh)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /install.sh {
        default_type text/plain;
        add_header Content-Disposition "inline";
    }
}

